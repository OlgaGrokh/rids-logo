*{box-sizing:border-box;margin:0}html,body{height:100%;background:#05080D;overflow:hidden}body{font:600 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;color:#C9DAEA}
#stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 42%,#101A27 0%,#0A111B 45%,#05080D 100%)}

.mx{position:absolute;background:radial-gradient(circle,rgba(170,205,235,.5) 0 .11vmin,transparent .13vmin) 0 0/.62vmin .62vmin;opacity:.0;animation:fl 5.5s steps(8) infinite}

.play .rain{animation:rn 3.2s cubic-bezier(.3,0,.3,1) both;animation-delay:calc(.7s + var(--d))}
@keyframes rn{0%{opacity:0;background-position:0 120%}25%{opacity:.8}70%{opacity:.5}100%{opacity:.12;background-position:0 -60%}}
.floor{position:absolute;left:50%;top:50%;width:46vmin;height:3vmin;transform:translate(-50%,13vmin);background:radial-gradient(closest-side,rgba(120,180,255,.28),transparent);opacity:0}.play .floor{animation:fd 2.4s .6s both}.still .floor{opacity:1}
.vig{position:absolute;inset:0;background:radial-gradient(90% 80% at 50% 50%,transparent 55%,rgba(0,0,0,.6) 100%);pointer-events:none}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wrap{position:absolute;inset:0;display:grid;place-items:center;padding:6vmin}
.grp{position:relative;width:min(100%,1180px,150vh);display:none}.grp[data-o=v]{width:min(78%,60vh)}.grp.on{display:block}
.ly{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.ly svg{overflow:visible}
.wide{filter:blur(1.7vmin);opacity:.78}.tight{filter:blur(.5vmin);opacity:1}.hot{opacity:.9;filter:blur(.05vmin)}.hot .ln{stroke-width:2.3}.shine{filter:blur(.22vmin);mix-blend-mode:screen}.shine .ln{stroke-width:3.6}
.ln{opacity:0}.still .wide .ln,.still .tight .ln,.still .core .ln,.still .hot .ln{opacity:1}
.wl path{opacity:0}.play .wl path{animation:gl .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(2.45s + var(--i)*32ms)}.still .wl path{opacity:1}
@keyframes gl{0%{opacity:0}35%{opacity:1}100%{opacity:1}}
.hair{opacity:0}.play .hair{animation:fd 1.6s 2s both}.still .hair{opacity:1}
.hd.mv{animation:mv 14s linear infinite;animation-delay:calc(var(--k)*-3s)}@keyframes mv{to{stroke-dashoffset:-140}}
.hb{opacity:0}.play .hb{animation:fd 1s 3s both}.still .hb{opacity:1}
@keyframes fd{from{opacity:0}to{opacity:1}}
.ui{position:absolute;left:0;right:0;bottom:2.4vmin;display:flex;gap:8px;justify-content:center;opacity:.0;transition:opacity .6s}.play .ui,.still .ui{opacity:1;transition-delay:3.2s}
.ui button{font:inherit;color:#C9DAEA;background:rgba(140,180,220,.1);border:1px solid rgba(160,200,240,.22);border-radius:99px;padding:9px 16px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ui button:hover{background:rgba(140,180,220,.2)}.ui button[aria-pressed=true]{background:#DCEBFA;color:#0A1622;border-color:#DCEBFA}.ui button:focus-visible{outline:2px solid #8FD0FF;outline-offset:2px}
.noui .ui{display:none}
@media(max-width:560px){.ui button{padding:8px 12px;font-size:12px}}
